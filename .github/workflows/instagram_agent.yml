name: Instagram DM Agent

on:
  # Runs Monday–Friday at 9am UK time (8am UTC, 9am BST)
  schedule:
    - cron: "0 8 * * 1-5"

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # 6 hours — enough for 20 DMs with 15 min gaps

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: app/scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r app/scripts/requirements.txt

      - name: Run Instagram agent
        env:
          INSTAGRAM_USERNAME:       ${{ secrets.INSTAGRAM_USERNAME }}
          INSTAGRAM_PASSWORD:       ${{ secrets.INSTAGRAM_PASSWORD }}
          INSTAGRAM_TOTP_SECRET:    ${{ secrets.INSTAGRAM_TOTP_SECRET }}
          SUPABASE_URL:             ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY:           ${{ secrets.OPENAI_API_KEY }}
        run: python app/scripts/instagram_agent.py
